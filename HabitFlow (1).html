<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HabitFlow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary: #0F5C56;
  --primary-dark: #0A423D;
  --primary-soft: #E4F1EF;
  --green: #1E9E5A;
  --green-soft: #E6F7EE;
  --orange: #C97F1E;
  --red: #C94B4B;
  --red-soft: #FBEAEA;
  --blue: #2F6FB0;
  --ink: #16211F;
  --sub: #667370;
  --border: #DDE6E4;
  --bg: #FFFFFF;
  --panel: #FFFFFF;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
}
button, input, select, textarea { font-family: inherit; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #C9D6D4; }

/* ---------- layout ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 250px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 40;
  transform: translateX(0);
  transition: transform .2s ease;
}
.sidebar.closed { transform: translateX(-100%); }

.brand { display: flex; align-items: center; gap: 10px; padding: 8px 8px 18px; }
.brand-mark {
  width: 32px; height: 32px; background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.brand-name { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px; font-size: 14px; font-weight: 500;
  color: var(--sub); background: transparent; border: none; text-align: left;
  cursor: pointer; width: 100%;
}
.nav-item:hover { background: #F3F8F7; }
.nav-item.active { background: var(--primary-soft); color: var(--primary-dark); }
.nav-icon { width: 18px; text-align: center; }

.sidebar-foot { margin-top: auto; font-size: 11px; color: var(--sub); padding: 10px 8px 0; }

.sidebar-overlay {
  display: none;
  position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 35;
}
.sidebar-overlay.show { display: block; }

.main { flex: 1; margin-left: 250px; padding: 22px 30px 60px; min-width: 0; }

.topbar { display: flex; align-items: flex-start; gap: 10px; }
.only-mobile { display: none; }

.icon-btn {
  border: 1px solid var(--border); background: #fff; padding: 8px 10px;
  cursor: pointer; font-size: 15px;
}

/* ---------- header ---------- */
.header { flex: 1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; }
.greeting-title { font-size: 22px; font-weight: 700; margin: 0; }
.greeting-sub { font-size: 13px; color: var(--sub); margin: 3px 0 0; }

.period-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.period-nav { display: flex; align-items: center; border: 1px solid var(--border); }
.period-nav button { border: none; background: transparent; padding: 7px 10px; cursor: pointer; font-size: 14px; }
.period-nav button:hover { background: #F3F8F7; }
.period-nav span { font-size: 13px; font-weight: 600; padding: 0 6px; white-space: nowrap; }

.btn-today { border: none; background: transparent; color: var(--sub); font-size: 13px; font-weight: 500; padding: 8px 10px; cursor: pointer; }
.btn-today:hover { text-decoration: underline; }

.period-toggle { display: flex; background: var(--primary-soft); padding: 3px; gap: 2px; }
.period-toggle button {
  border: none; background: transparent; font-size: 12px; font-weight: 600; padding: 6px 10px; cursor: pointer; color: var(--sub);
}
.period-toggle button.active { background: #fff; color: var(--primary-dark); }

.header-actions { display: flex; gap: 8px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: none; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-soft { background: var(--primary-soft); color: var(--primary-dark); }
.btn-soft:hover { background: #d6ebe8; }
.btn-ghost { background: transparent; color: var(--sub); }
.btn-ghost:hover { text-decoration: underline; }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-danger:hover { background: #f7dede; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- cards ---------- */
.card { background: var(--panel); border: 1px solid var(--border); padding: 18px; }
.card + .card { margin-top: 0; }
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 980px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

.stat-label { font-size: 12px; color: var(--sub); font-weight: 600; display:flex; justify-content:space-between; align-items:center; }
.stat-value { font-size: 24px; font-weight: 700; margin-top: 8px; }
.stat-sub { font-size: 11px; margin-top: 4px; font-weight: 600; color: var(--sub); }

.section-title { font-size: 14px; font-weight: 700; margin: 0 0 14px; }
.flex-row { display: flex; flex-wrap: wrap; gap: 16px; }
.flex-1 { flex: 1; min-width: 160px; }

/* ---------- empty state ---------- */
.empty { color: var(--sub); font-size: 13px; text-align: center; padding: 40px 12px; }

/* ---------- bar chart ---------- */
.bars { display: flex; align-items: flex-end; gap: 4px; height: 190px; }
.bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
.bar-col .bar { width: 65%; max-width: 30px; background: var(--primary); transition: height .25s ease; }
.bar-labels { display: flex; gap: 4px; margin-top: 6px; }
.bar-labels span { flex: 1; text-align: center; font-size: 10.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-tooltip {
  position: absolute; bottom: 100%; margin-bottom: 6px; background: #fff; border: 1px solid var(--border);
  padding: 6px 9px; font-size: 11px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,0.1); z-index: 5;
  display: none;
}
.bar-col:hover .bar-tooltip { display: block; }

/* ---------- horizontal bars ---------- */
.hbar-row { margin-bottom: 12px; }
.hbar-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
.hbar-track { height: 10px; background: var(--primary-soft); }
.hbar-fill { height: 10px; transition: width .25s ease; }

/* ---------- donut ---------- */
.donut-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.donut-center .pct { font-size: 24px; font-weight: 700; }
.donut-center .lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }

/* ---------- line chart legend ---------- */
.legend { display: flex; gap: 16px; font-size: 11px; color: var(--sub); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 8px; height: 8px; display: inline-block; }

/* ---------- week table ---------- */
table.week-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
table.week-table th { text-align: center; font-weight: 600; color: var(--sub); padding-bottom: 10px; font-size: 11px; }
table.week-table th:first-child { text-align: left; }
table.week-table td { padding: 10px 4px; border-top: 1px solid var(--border); text-align: center; }
table.week-table td:first-child { text-align: left; font-weight: 600; white-space: nowrap; }
.check-btn {
  width: 28px; height: 28px; border: 1px solid var(--border); background: #F3F8F7; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: transparent;
}
.check-btn.done { color: #fff; border-color: transparent; }

/* ---------- calendar ---------- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
.cal-cell {
  aspect-ratio: 1; border: 1px solid var(--border); background: #F6FAF9; display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink);
}
.cal-cell.today { outline: 2px solid var(--primary-dark); outline-offset: -2px; }
.cal-legend { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 11px; color: var(--sub); }
.cal-legend span.sw { width: 16px; height: 16px; display: inline-block; border: 1px solid var(--border); }

/* ---------- year view ---------- */
.year-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.year-row .m-label { width: 90px; font-size: 12px; color: var(--sub); flex-shrink: 0; }
.year-row .m-track { flex: 1; height: 10px; background: var(--primary-soft); }
.year-row .m-fill { height: 10px; }
.year-row .m-pct { width: 40px; text-align: right; font-size: 12px; font-weight: 600; }

/* ---------- habits / goals cards ---------- */
.habit-card, .goal-card { background: var(--panel); border: 1px solid var(--border); padding: 15px; }
.habit-top { display: flex; justify-content: space-between; align-items: flex-start; }
.habit-info { display: flex; gap: 10px; align-items: center; }
.habit-icon { width: 36px; height: 36px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.habit-name { font-weight: 700; font-size: 13.5px; }
.habit-meta { font-size: 11px; color: var(--sub); margin-top: 2px; }
.habit-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 14px; text-align: center; }
.habit-stats .v { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; }
.habit-stats .l { font-size: 10px; color: var(--sub); margin-top: 2px; }
.habit-target { font-size: 11px; color: var(--sub); margin-top: 12px; }
.small-icon-btn { border: none; background: transparent; cursor: pointer; padding: 4px; font-size: 13px; color: var(--sub); }
.small-icon-btn:hover { color: var(--ink); }

.goal-top { display: flex; justify-content: space-between; align-items: flex-start; }
.goal-name { font-weight: 700; font-size: 13.5px; }
.goal-progress-text { font-size: 11px; color: var(--sub); margin-top: 3px; }
.goal-bar-track { height: 8px; background: var(--primary-soft); margin-top: 10px; }
.goal-bar-fill { height: 8px; }
.goal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.stepper { display: flex; gap: 4px; }
.stepper button { width: 24px; height: 24px; border: 1px solid var(--border); background: var(--primary-soft); cursor: pointer; font-size: 13px; }

.section-block + .section-block { margin-top: 26px; }
.section-sub { font-weight: 400; color: var(--sub); font-size: 12px; }

/* ---------- forms / modal ---------- */
.field { display: block; margin-bottom: 13px; }
.field-label { display: block; font-size: 11.5px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--border); padding: 8px 10px; font-size: 13px; background: #FAFDFD; outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(10,25,23,0.4); z-index: 60;
  align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal { background: #fff; width: 100%; max-width: 420px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
.modal-foot { display: flex; justify-content: space-between; margin-top: 6px; }
.modal-foot.end { justify-content: flex-end; }

.slider-row { margin-bottom: 12px; }
.slider-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--sub); }
.slider-top b { color: var(--ink); }
input[type="range"] { width: 100%; accent-color: var(--primary); }

.recent-row { display: flex; justify-content: space-between; font-size: 11.5px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.recent-row .d { font-weight: 700; }
.recent-row .v { color: var(--sub); }

/* ---------- settings ---------- */
.settings-card { max-width: 520px; }
.settings-card p { font-size: 13px; color: var(--sub); line-height: 1.6; }

body.theme-dark {
  --primary: #2BA89C;
  --primary-dark: #1F8478;
  --primary-soft: #16302D;
  --green: #34C77B;
  --green-soft: #123424;
  --orange: #E0A345;
  --red: #E2726B;
  --red-soft: #3A1E1E;
  --blue: #5B9BD9;
  --ink: #EAF3F1;
  --sub: #9BB0AC;
  --border: #263531;
  --bg: #0E1512;
  --panel: #14201D;
}
body.theme-dark .cal-cell { background: #182420; }
body.theme-dark .check-btn { background: #182420; }
body.theme-dark .field input,
body.theme-dark .field select,
body.theme-dark .field textarea { background: #0F1A17; color: var(--ink); }
body.theme-dark .bar-col .bar { background: var(--primary); }
body.theme-dark ::-webkit-scrollbar-thumb { background: #2A3B37; }

.theme-toggle { display: flex; gap: 8px; margin-top: 4px; }
.theme-btn {
  flex: 1; border: 1px solid var(--border); background: var(--panel); padding: 14px 10px;
  cursor: pointer; text-align: center; font-size: 13px; font-weight: 600; color: var(--sub);
}
.theme-btn.active { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }
.theme-btn .swatch { font-size: 20px; display: block; margin-bottom: 6px; }

.account-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border: 1px solid var(--border); margin-top: 10px; }
.account-box .who { font-size: 13px; font-weight: 700; }
.account-box .sub { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
.account-list-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--border); font-size: 13px; }
.account-list-row:first-child { border-top: none; }
.tag-guest { font-size: 10.5px; background: var(--primary-soft); color: var(--primary-dark); padding: 2px 7px; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 16px; }
  .only-mobile { display: inline-flex; }
}

</style>
</head>
<body>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <span class="brand-name">HabitFlow</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot">Tus datos se guardan automáticamente en este navegador.</div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main">
      <div class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn">☰</button>
        <div id="header" class="header"></div>
      </div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBox"></div>
  </div>

  <script>
/* =========================================================================
   HABITFLOW — vanilla JS, no build step, no external libraries.
   ========================================================================= */

/* ---------------------------------- CONSTANTS ---------------------------------- */
const HABIT_COLORS = ["#0F5C56", "#2F6FB0", "#1E9E5A", "#C97F1E", "#C94B4B", "#0E8C8C"];
const CATEGORY_OPTIONS = ["Health", "Study", "Fitness", "Personal", "Sleep", "Other"];
const FREQ_OPTIONS = [
  { v: "daily", l: "Diario" }, { v: "weekly", l: "Semanal" }, { v: "custom", l: "Personalizado" },
];
const UNIT_OPTIONS = [
  { v: "times", l: "veces" }, { v: "minutes", l: "minutos" }, { v: "hours", l: "horas" },
  { v: "days", l: "días" }, { v: "points", l: "puntos" },
];
const DOW = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const STORAGE_KEY = "habitflow_data_v2";
const ACTIVE_ACCOUNT_KEY = "habitflow_supabase_email_v1";
const THEME_KEY = "habitflow_theme_v1";

/* ======================= SUPABASE CLOUD CONFIG =======================
   1) Create a Supabase project.
   2) Paste the Project URL and anon/public key below.
   3) Run the SQL file that comes with this app.
   Never put a service_role key in this HTML.
====================================================================== */
const SUPABASE_URL = "https://agnryubxpimunhhcvtqu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_XS8MoKd1kRk-AGDMEnyUsQ_YBzqbvdU";
const CLOUD_READY = !SUPABASE_URL.includes("PEGA_AQUI") && !SUPABASE_ANON_KEY.includes("PEGA_AQUI");
const supabaseClient = (window.supabase && CLOUD_READY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function getActiveAccount() { try { return localStorage.getItem(ACTIVE_ACCOUNT_KEY) || null; } catch (e) { return null; } }
function setActiveAccountStorage(email) { try { if (email) localStorage.setItem(ACTIVE_ACCOUNT_KEY, email); else localStorage.removeItem(ACTIVE_ACCOUNT_KEY); } catch (e) {} }
function loadDataFor(username) { try { const raw = localStorage.getItem(username ? `habitflow_cloud_cache_${username}` : STORAGE_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; } }
function dataKeyFor(username) { return username ? `habitflow_cloud_cache_${username}` : STORAGE_KEY; }
function cacheDataFor(email, data) { try { localStorage.setItem(`habitflow_cloud_cache_${email}`, JSON.stringify(data)); } catch(e) {} }
function getTheme() { try { return localStorage.getItem(THEME_KEY) || "light"; } catch (e) { return "light"; } }
function applyTheme(theme) {
  document.body.classList.toggle("theme-dark", theme === "dark");
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}

async function cloudSave() {
  if (!supabaseClient || !state.account) return;
  const { data: sessionData } = await supabaseClient.auth.getSession();
  const user = sessionData?.session?.user;
  if (!user) return;
  const payload = { habits: state.habits, completions: state.completions, wellness: state.wellness, goals: state.goals };
  cacheDataFor(state.account, payload);
  const { error } = await supabaseClient.from("habitflow_data").upsert({ user_id: user.id, payload, updated_at: new Date().toISOString() });
  if (error) console.warn("HabitFlow cloud save:", error.message);
}
async function cloudLoad(user) {
  const { data, error } = await supabaseClient.from("habitflow_data").select("payload").eq("user_id", user.id).maybeSingle();
  if (error) throw error;
  return data?.payload || null;
}
async function handleCloudSession(session) {
  if (!session?.user) {
    setActiveAccountStorage(null);
    reloadStateFromStorage(null);
    render();
    return;
  }
  const email = session.user.email || "Cuenta";
  let data = null;
  try { data = await cloudLoad(session.user); } catch(e) { console.warn(e); }
  setActiveAccountStorage(email);
  state.account = email;
  state.habits = data?.habits || seedHabits.slice();
  state.completions = data?.completions || {};
  state.wellness = data?.wellness || {};
  state.goals = data?.goals || {week:{}, month:{}, year:{}};
  if (!data) await cloudSave();
  render();
}
async function initCloudAuth() {
  if (!supabaseClient) return;
  const { data } = await supabaseClient.auth.getSession();
  await handleCloudSession(data.session);
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    setTimeout(() => handleCloudSession(session), 0);
  });
}

const seedHabits = [
  { id: "h1", name: "Entrenar", icon: "🏃", category: "Fitness", frequency: "weekly", target: 5, color: HABIT_COLORS[0] },
  { id: "h2", name: "Leer", icon: "📖", category: "Personal", frequency: "daily", target: 7, color: HABIT_COLORS[1] },
  { id: "h3", name: "Beber agua", icon: "💧", category: "Health", frequency: "daily", target: 7, color: HABIT_COLORS[2] },
  { id: "h4", name: "Estudiar", icon: "📚", category: "Study", frequency: "daily", target: 7, color: HABIT_COLORS[3] },
];

/* ---------------------------------- DATE HELPERS ---------------------------------- */
const pad2 = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const addYears = (d, n) => { const r = new Date(d); r.setFullYear(r.getFullYear() + n); return r; };
const startOfWeek = (d) => { const r = new Date(d); const day = (r.getDay() + 6) % 7; r.setDate(r.getDate() - day); r.setHours(0,0,0,0); return r; };
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
function getISOWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
}
const weekKey = (d) => `${d.getFullYear()}-W${pad2(getISOWeek(d))}`;
const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
const yearKey = (d) => `${d.getFullYear()}`;
function periodLabel(periodType, date) {
  if (periodType === "week") {
    const s = startOfWeek(date), e = addDays(s, 6);
    return `${s.getDate()} ${MONTHS[s.getMonth()].slice(0,3)} – ${e.getDate()} ${MONTHS[e.getMonth()].slice(0,3)} ${e.getFullYear()}`;
  }
  if (periodType === "month") return `${MONTHS[date.getMonth()]} ${date.getFullYear()}`;
  return `${date.getFullYear()}`;
}
function shiftPeriod(periodType, date, dir) {
  if (periodType === "week") return addDays(date, 7 * dir);
  if (periodType === "month") return addMonths(date, dir);
  return addYears(date, dir);
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------------------------------- DERIVED HELPERS ---------------------------------- */
function dayRate(key) {
  if (state.habits.length === 0) return 0;
  const done = state.habits.filter((h) => state.completions[key] && state.completions[key][h.id]).length;
  return done / state.habits.length;
}
function toggleHabit(key, habitId) {
  if (!state.completions[key]) state.completions[key] = {};
  state.completions[key][habitId] = !state.completions[key][habitId];
  persist(); render();
}
function habitStreak(habitId, from) {
  let streak = 0, d = new Date(from || new Date());
  while (state.completions[toKey(d)] && state.completions[toKey(d)][habitId]) { streak++; d = addDays(d, -1); }
  return streak;
}
function habitBestStreak(habitId) {
  const dates = Object.keys(state.completions).filter((k) => state.completions[k] && state.completions[k][habitId]).sort();
  if (!dates.length) return 0;
  let best = 1, cur = 1;
  for (let i = 1; i < dates.length; i++) {
    if ((new Date(dates[i]) - new Date(dates[i-1])) / 86400000 === 1) { cur++; best = Math.max(best, cur); } else cur = 1;
  }
  return best;
}
function overallStreak() {
  let streak = 0, d = new Date();
  while (dayRate(toKey(d)) > 0) { streak++; d = addDays(d, -1); }
  return streak;
}
function overallBestStreak() {
  const dates = Object.keys(state.completions).filter((k) => dayRate(k) > 0).sort();
  if (!dates.length) return 0;
  let best = 1, cur = 1;
  for (let i = 1; i < dates.length; i++) {
    if ((new Date(dates[i]) - new Date(dates[i-1])) / 86400000 === 1) { cur++; best = Math.max(best, cur); } else cur = 1;
  }
  return best;
}
function getPeriodDates() {
  const { periodType, currentDate } = state;
  if (periodType === "week") return Array.from({length:7}, (_,i) => addDays(startOfWeek(currentDate), i));
  if (periodType === "month") {
    const n = daysInMonth(currentDate.getFullYear(), currentDate.getMonth());
    return Array.from({length:n}, (_,i) => new Date(currentDate.getFullYear(), currentDate.getMonth(), i+1));
  }
  return Array.from({length:12}, (_,i) => new Date(currentDate.getFullYear(), i, 1));
}
function getCurrentGoalKey() {
  const { periodType, currentDate } = state;
  return periodType === "week" ? weekKey(currentDate) : periodType === "month" ? monthKey(currentDate) : yearKey(currentDate);
}
function getPeriodStats() {
  const { periodType, currentDate, habits } = state;
  let totalCells = 0, doneCells = 0;
  if (periodType === "year") {
    for (let m = 0; m < 12; m++) {
      const n = daysInMonth(currentDate.getFullYear(), m);
      for (let day = 1; day <= n; day++) {
        const key = toKey(new Date(currentDate.getFullYear(), m, day));
        doneCells += habits.filter((h) => state.completions[key] && state.completions[key][h.id]).length;
        totalCells += habits.length;
      }
    }
  } else {
    getPeriodDates().forEach((d) => {
      totalCells += habits.length;
      doneCells += habits.filter((h) => state.completions[toKey(d)] && state.completions[toKey(d)][h.id]).length;
    });
  }
  return { totalCells, doneCells, rate: totalCells ? doneCells / totalCells : 0 };
}

/* ---------------------------------- CRUD ---------------------------------- */
function saveHabit(habit) {
  if (habit.id) state.habits = state.habits.map((h) => (h.id === habit.id ? Object.assign({}, h, habit) : h));
  else state.habits.push(Object.assign({}, habit, { id: "h" + Date.now(), color: HABIT_COLORS[state.habits.length % HABIT_COLORS.length] }));
  persist(); closeModal(); render();
}
function deleteHabit(id) { state.habits = state.habits.filter((h) => h.id !== id); persist(); closeModal(); render(); }

function saveGoal(goal) {
  const key = goal.period === "week" ? weekKey(state.currentDate) : goal.period === "month" ? monthKey(state.currentDate) : yearKey(state.currentDate);
  const list = state.goals[goal.period][key] || [];
  const exists = goal.id && list.some((x) => x.id === goal.id);
  if (exists) state.goals[goal.period][key] = list.map((x) => (x.id === goal.id ? Object.assign({}, x, goal) : x));
  else {
    if (!state.goals[goal.period][key]) state.goals[goal.period][key] = [];
    state.goals[goal.period][key].push(Object.assign({}, goal, { id: goal.id || "g" + Date.now(), current: goal.current || 0 }));
  }
  persist(); closeModal(); render();
}
function deleteGoal(period, key, id) {
  state.goals[period][key] = (state.goals[period][key] || []).filter((x) => x.id !== id);
  persist(); render();
}
function bumpGoal(period, key, id, delta) {
  state.goals[period][key] = (state.goals[period][key] || []).map((x) => (x.id === id ? Object.assign({}, x, { current: Math.max(0, (x.current||0) + delta) }) : x));
  persist(); render();
}

async function createAccount(email, password) {
  email = (email || "").trim();
  if (!email || !email.includes("@")) { alert("Escribe un correo válido."); return; }
  if (!supabaseClient) { alert("Primero conecta Supabase en las variables SUPABASE_URL y SUPABASE_ANON_KEY del archivo."); return; }
  if (!password || password.length < 6) { alert("La contraseña debe tener al menos 6 caracteres."); return; }
  // Supabase necesita una URL de redirección válida después de confirmar el correo.
  // Si HabitFlow se abre como archivo local (file://), usamos la URL del proyecto
  // para evitar el error "no se puede acceder". Si está publicado en http/https,
  // volvemos directamente a HabitFlow.
  const currentUrl = window.location.href;
  const redirectTo = (window.location.protocol === "http:" || window.location.protocol === "https:")
    ? currentUrl.split("#")[0]
    : SUPABASE_URL;
  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { emailRedirectTo: redirectTo }
  });
  if (error) { alert(error.message); return; }
  if (data?.session) {
    alert("Cuenta creada y sesión iniciada.");
  } else {
    alert("Cuenta creada. Revisa tu correo y pulsa el enlace de confirmación. Después vuelve a HabitFlow e inicia sesión.");
  }
  closeModal();
}
async function loginAccount(email, password) {
  if (!supabaseClient) { alert("Primero conecta Supabase en el archivo."); return; }
  const { error } = await supabaseClient.auth.signInWithPassword({ email: (email||"").trim(), password: password || "" });
  if (error) { alert(error.message); return; }
  closeModal();
}
async function logoutAccount() {
  if (supabaseClient) await supabaseClient.auth.signOut();
  setActiveAccountStorage(null);
  reloadStateFromStorage(null);
  render();
}

}

function donutHTML(percent, size, stroke) {
  size = size || 170; stroke = stroke || 18;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - percent/100);

    <div class="donut-wrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">

function mountainChartHTML(data, height, colorVar) {
  height = height || 230;
  if (!data || !data.length) return "";
  const w = 700, padX = 18, padY = 20;
  const max = 100;
  const step = data.length > 1 ? (w - padX*2) / (data.length - 1) : 0;
  const pts = data.map((d,i) => {
    const x = padX + i*step;
    const v = Math.max(0, Math.min(max, Number(d.value) || 0));
    const y = height - padY - (v/max)*(height-padY*2);
    return [x,y,v,d];
  });
  const line = pts.map((p,i)=>(i?"L":"M")+p[0]+","+p[1]).join(" " );
  const area = `M ${pts[0][0]},${height-padY} ${pts.map(p=>`L ${p[0]},${p[1]}`).join(" " )} L ${pts[pts.length-1][0]},${height-padY} Z`;
  const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(${colorVar || '--primary'})"><title>${esc(String(p[3].tip || p[3].label || ''))}</title></circle>`).join("");
  const labels = data.map(d=>`<span>${esc(d.label)}</span>`).join("");
  return `<div class="mountain-chart">
    <svg viewBox="0 0 ${w} ${height}" style="width:100%;height:${height}px;display:block;overflow:visible;" preserveAspectRatio="none">

      <path d="${area}" fill="url(#mountainGrad)"></path>
      <path d="${line}" fill="none" stroke="var(${colorVar || '--primary'})" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
      ${dots}
    </svg>
    <div class="bar-labels">${labels}</div>
  </div>`;
}
function lineChartHTML(data, height) {
  height = height || 210;
  const w = 600, padding = 16, max = 10;
  if (!data.length) return "";
  const stepX = data.length > 1 ? (w - padding*2) / (data.length - 1) : 0;
  const pointsFor = (key) => data.map((d,i) => (d[key] != null ? [padding + i*stepX, height - padding - (d[key]/max)*(height-padding*2)] : null));
  const pathFor = (key) => {
    const pts = pointsFor(key); let path = ""; let started = false;
    pts.forEach((p) => { if (!p) { started = false; return; } path += (started?"L":"M") + p[0] + "," + p[1] + " "; started = true; });
    return path.trim();
  };
  const rects = data.map((d,i) => {
    const cx = padding + i*stepX;
    const title = `${esc(d.label)}${d.mood!=null? " · Mood " + d.mood : ""}${d.sleep!=null? " · Sueño " + d.sleep + "h" : ""}`;
    return `<rect x="${Math.max(0,cx-stepX/2)}" y="0" width="${Math.max(stepX,1)}" height="${height}" fill="transparent"><title>${title}</title></rect>`;
  }).join("");
  const labels = data.map((d) => `<span>${esc(d.label)}</span>`).join("");
  return `
    <svg viewBox="0 0 ${w} ${height}" style="width:100%;height:${height}px;display:block;" preserveAspectRatio="none">
      <path d="${pathFor('mood')}" fill="none" stroke="#0F5C56" stroke-width="2.5"></path>

    <div class="legend"><span><span class="dot" style="background:#0F5C56;"></span>Mood</span><span><span class="dot" style="background:#2F6FB0;"></span>Sleep</span></div>`;
}

function viewDashboard() {
  const habits = state.habits, periodDates = getPeriodDates(), periodType = state.periodType;
  const stats = getPeriodStats();

  const dailyData = periodDates.map((d) => {
    if (periodType === "year") {
      const n = daysInMonth(d.getFullYear(), d.getMonth());
      let done=0, tot=0;
      for (let day=1; day<=n; day++) {
        const key = toKey(new Date(d.getFullYear(), d.getMonth(), day));
        done += habits.filter((h) => state.completions[key] && state.completions[key][h.id]).length; tot += habits.length;
      }
      return { label: MONTHS[d.getMonth()].slice(0,3), value: tot ? Math.round((done/tot)*100) : 0, tip: `${MONTHS[d.getMonth()]}: ${tot?Math.round((done/tot)*100):0}%` };
    }
    const key = toKey(d);
    const done = habits.filter((h) => state.completions[key] && state.completions[key][h.id]).length;
    const label = periodType === "week" ? DOW[(d.getDay()+6)%7] : String(d.getDate());
    const dateStr = d.toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"short" });
    const val = habits.length ? Math.round((done/habits.length)*100) : 0;
    return { label, value: val, tip: `${dateStr}<br>${done} / ${habits.length} hábitos<br><b>${val}%</b>` };
  });

  const y = state.currentDate.getFullYear(), m = state.currentDate.getMonth();
  const nDays = daysInMonth(y, m);
  const buckets = [[],[],[],[],[]];
  for (let day=1; day<=nDays; day++) buckets[Math.floor((day-1)/7)].push(day);
  const weeksOfMonth = buckets.filter((b)=>b.length).map((days,i) => {
    let done=0, tot=0;
    days.forEach((day) => {
      const key = toKey(new Date(y, m, day));
      done += habits.filter((h) => state.completions[key] && state.completions[key][h.id]).length; tot += habits.length;
    });
    return { label: `Sem ${i+1}`, value: tot ? Math.round((done/tot)*100) : 0 };
  });

  const wellnessData = periodDates.map((d) => {
    if (periodType === "year") {
      const n = daysInMonth(d.getFullYear(), d.getMonth());
      let ms=[], ss=[];
      for (let day=1; day<=n; day++) {
        const w = state.wellness[toKey(new Date(d.getFullYear(), d.getMonth(), day))];
        if (w) { ms.push(+w.mood); ss.push(+w.sleep); }
      }
      return { label: MONTHS[d.getMonth()].slice(0,3), mood: ms.length? +(ms.reduce((a,b)=>a+b,0)/ms.length).toFixed(1): null, sleep: ss.length? +(ss.reduce((a,b)=>a+b,0)/ss.length).toFixed(1): null };
    }
    const key = toKey(d); const w = state.wellness[key];
    const label = periodType === "week" ? DOW[(d.getDay()+6)%7] : String(d.getDate());
    return { label, mood: w? +w.mood : null, sleep: w? +w.sleep : null };
  });
  const hasWellness = Object.keys(state.wellness).length > 0;

  const currentGoals = state.goals[periodType][getCurrentGoalKey()] || [];

  const yearForDashboard = state.currentDate.getFullYear();
  const monthForDashboard = state.currentDate.getMonth();
  const monthDaysForDashboard = daysInMonth(yearForDashboard, monthForDashboard);
  const monthDailyData = Array.from({length: monthDaysForDashboard}, (_,i) => {
    const day = i + 1;
    const key = toKey(new Date(yearForDashboard, monthForDashboard, day));
    const value = habits.length ? Math.round(dayRate(key) * 100) : 0;
    return { label: String(day), value, tip: `${day} ${MONTHS[monthForDashboard]}<br><b>${value}%</b>` };
  });
  const yearMonthData = Array.from({length:12}, (_,m) => {
    const n = daysInMonth(yearForDashboard, m); let done=0, tot=0;
    for (let day=1; day<=n; day++) {
      const key = toKey(new Date(yearForDashboard, m, day));
      done += habits.filter((h)=>state.completions[key] && state.completions[key][h.id]).length; tot += habits.length;
    }
    return { label: MONTHS[m].slice(0,3), value: tot ? Math.round((done/tot)*100) : 0, tip: `${MONTHS[m]} ${yearForDashboard}<br><b>${tot?Math.round((done/tot)*100):0}%</b>` };
  });

  return `
    <div class="grid grid-4">
      <div class="card flex-1"><div class="stat-label">Completion Rate</div><div class="stat-value">${Math.round(stats.rate*100)}%</div><div class="stat-sub">${stats.totalCells? 'de este periodo':'sin datos aún'}</div></div>
      <div class="card flex-1"><div class="stat-label">Completados</div><div class="stat-value">${stats.doneCells} / ${stats.totalCells}</div></div>
      <div class="card flex-1"><div class="stat-label">Racha actual 🔥</div><div class="stat-value" style="color:var(--orange)">${overallStreak()} días</div></div>
      <div class="card flex-1"><div class="stat-label">Mejor racha 🏆</div><div class="stat-value">${overallBestStreak()} días</div></div>
    </div>

    <div class="grid" style="grid-template-columns: 2fr 1fr; margin-top:16px;">
      <div class="card">
        <div class="section-title">Progreso diario</div>
        ${habits.length===0 ? `<div class="empty">Añade un hábito para ver tu progreso.</div>` : barChartHTML(dailyData, "#0F5C56", 100, (d)=>d.tip)}
      </div>
      <div class="card">
        <div class="section-title">Overall Stats</div>
        ${donutHTML(stats.rate*100)}
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card">
        <div class="section-title">Progreso semanal (mes actual)</div>
        ${barChartHTML(weeksOfMonth, "#2F6FB0", 100, (d)=>d.value+"%")}
      </div>
      <div class="card">
        <div class="section-title">Overall Wellness</div>
        ${hasWellness ? lineChartHTML(wellnessData) : `<div class="empty">Registra tu ánimo y sueño en Wellness.</div>`}
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card">
        <div class="section-title">Montaña de progreso mensual — ${MONTHS[monthForDashboard]}</div>
        ${habits.length===0 ? `<div class="empty">Añade un hábito para ver la montaña mensual.</div>` : mountainChartHTML(monthDailyData, 230, "--primary")}
      </div>
      <div class="card">
        <div class="section-title">Montaña de progreso anual — ${yearForDashboard}</div>
        ${habits.length===0 ? `<div class="empty">Añade un hábito para ver la evolución anual.</div>` : mountainChartHTML(yearMonthData, 230, "--blue")}
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="section-title">Progreso del año ${yearForDashboard}</div>
      ${habits.length===0 ? `<div class="empty">Añade un hábito para ver tu progreso anual.</div>` : barChartHTML(yearMonthData, "#0E8C8C", 100, (d)=>d.tip)}
    </div>

    ${currentGoals.length ? `
    <div class="card" style="margin-top:16px;">
      <div class="section-title">Metas de este periodo</div>
      <div class="grid grid-3">${currentGoals.map((g)=>goalCardHTML(g, periodType, getCurrentGoalKey(), true)).join("")}</div>
    </div>` : ""}
  `;
}

function viewWeek() {
  const habits = state.habits, dates = getPeriodDates();
  if (habits.length === 0) return `<div class="card"><div class="empty">Todavía no tienes hábitos. Añade uno para empezar a marcar tu semana.</div></div>`;
  const rows = habits.map((h) => `
    <tr>
      <td>${h.icon} ${esc(h.name)}</td>
      ${dates.map((d) => {
        const key = toKey(d); const done = !!(state.completions[key] && state.completions[key][h.id]);
        return `<td><button class="check-btn ${done?'done':''}" style="${done?`background:${h.color};`:''}" onclick="toggleHabit('${key}','${h.id}')">✓</button></td>`;
      }).join("")}
    </tr>`).join("");
  const heads = dates.map((d) => `<th><div>${DOW[(d.getDay()+6)%7]}</div><div style="font-weight:400;">${d.getDate()}</div></th>`).join("");
  return `<div class="card" style="overflow-x:auto;"><table class="week-table"><thead><tr><th>Hábito</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function viewMonth() {
  const y = state.currentDate.getFullYear(), m = state.currentDate.getMonth();
  const first = new Date(y, m, 1), lead = (first.getDay()+6)%7, n = daysInMonth(y, m);
  const cells=[]; for(let i=0;i<lead;i++) cells.push(null); for(let d=1;d<=n;d++) cells.push(d);
  const intensity=(rate)=>rate===0?"#F6FAF9":rate<.26?"#BFE0DC":rate<.51?"#89C4BD":rate<.76?"#4C9C93":"#0F5C56";
  const dow=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  const dayCells=cells.map(day=>{if(!day)return `<div></div>`;const date=new Date(y,m,day),key=toKey(date),rate=state.habits.length?dayRate(key):0,isToday=key===toKey(new Date()),bg=intensity(rate),textColor=rate>.5?"#fff":"var(--ink)";return `<button class="cal-cell ${isToday?'today':''}" style="background:${bg};color:${textColor};" onclick="openDayModal('${key}')">${day}</button>`;}).join("");
  const monthlyDailyData=Array.from({length:n},(_,i)=>{const day=i+1,key=toKey(new Date(y,m,day)),value=state.habits.length?Math.round(dayRate(key)*100):0;return {label:String(day),value,tip:`${day} ${MONTHS[m]}<br><b>${value}%</b>`};});
  const monthlyWeeks=Array.from({length:Math.ceil(n/7)},(_,i)=>{const start=i*7+1,end=Math.min(n,start+6);let done=0,tot=0;for(let day=start;day<=end;day++){const key=toKey(new Date(y,m,day));done+=state.habits.filter(h=>state.completions[key]&&state.completions[key][h.id]).length;tot+=state.habits.length;}return {label:`Sem ${i+1}`,value:tot?Math.round(done/tot*100):0};});
  const monthlyWellness=monthlyDailyData.map((d,i)=>{const w=state.wellness[toKey(new Date(y,m,i+1))];return {label:d.label,mood:w?+w.mood:null,sleep:w?+w.sleep:null};});
  const hasMonthlyWellness=monthlyWellness.some(d=>d.mood!==null||d.sleep!==null);
  return `
    <div class="card"><div class="cal-grid">${dow}</div><div class="cal-grid" style="margin-top:6px;">${dayCells}</div><div class="cal-legend">Menos ${["#F6FAF9","#BFE0DC","#89C4BD","#4C9C93","#0F5C56"].map(c=>`<span class="sw" style="background:${c};"></span>`).join("")} Más</div></div>
    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card"><div class="section-title">Progreso diario — ${MONTHS[m]}</div>${state.habits.length?barChartHTML(monthlyDailyData,"#0F5C56",100,d=>d.tip):`<div class="empty">Añade un hábito para ver el progreso mensual.</div>`}</div>
      <div class="card"><div class="section-title">Montaña mensual</div>${state.habits.length?mountainChartHTML(monthlyDailyData,230,"--primary"):`<div class="empty">Añade un hábito para ver la montaña mensual.</div>`}</div>
    </div>
    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card"><div class="section-title">Comparación por semanas</div>${state.habits.length?barChartHTML(monthlyWeeks,"#2F6FB0",100,d=>d.value+"%"):`<div class="empty">Añade un hábito para comparar las semanas.</div>`}</div>
      <div class="card"><div class="section-title">Wellness mensual</div>${hasMonthlyWellness?lineChartHTML(monthlyWellness):`<div class="empty">Registra Mood y Sleep para ver esta gráfica.</div>`}</div>
    </div>`;
}
function openDayModal(dayKey) {
  const habits = state.habits;
  const done = habits.filter((h) => state.completions[dayKey] && state.completions[dayKey][h.id]);
  const pending = habits.filter((h) => !(state.completions[dayKey] && state.completions[dayKey][h.id]));
  const w = state.wellness[dayKey];
  const d = new Date(dayKey);
  const title = d.toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long" });
  const doneHTML = done.length ? done.map((h)=>`<span style="font-size:11px;padding:5px 8px;background:var(--green-soft);margin:2px;display:inline-block;">${h.icon} ${esc(h.name)}</span>`).join("") : `<span style="font-size:12px;color:var(--sub)">Ninguno</span>`;
  const pendHTML = pending.length ? pending.map((h)=>`<span style="font-size:11px;padding:5px 8px;background:var(--red-soft);margin:2px;display:inline-block;">${h.icon} ${esc(h.name)}</span>`).join("") : `<span style="font-size:12px;color:var(--sub)">Ninguno</span>`;
  const wellnessHTML = w ? `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
      <div>Mood: <b>${w.mood}/10</b></div><div>Sueño: <b>${w.sleep}h</b></div>
      <div>Energía: <b>${w.energy}/10</b></div><div>Estrés: <b>${w.stress}/10</b></div>
      ${w.notes ? `<div style="grid-column:1/-1;font-size:11px;color:var(--sub);">${esc(w.notes)}</div>` : ""}
    </div>` : `<div style="font-size:12px;color:var(--sub);margin-top:10px;">Sin registro de wellness este día.</div>`;
  openModal(`
    <div class="modal-head"><h3 style="text-transform:capitalize;">${title}</h3><button class="small-icon-btn" onclick="closeModal()">✕</button></div>
    <div style="font-size:11.5px;font-weight:700;color:var(--green);margin-bottom:4px;">Completados (${done.length})</div>
    <div style="margin-bottom:12px;">${doneHTML}</div>
    <div style="font-size:11.5px;font-weight:700;color:var(--red);margin-bottom:4px;">Pendientes (${pending.length})</div>
    <div>${pendHTML}</div>
    ${wellnessHTML}
  `);
}

function viewYear() {
  const y = state.currentDate.getFullYear();
  const habits = state.habits;
  const monthRates = Array.from({length:12}, (_,m) => {
    const n = daysInMonth(y,m); let done=0, tot=0;
    for (let day=1; day<=n; day++) { const key = toKey(new Date(y,m,day)); done += habits.filter((h)=>state.completions[key] && state.completions[key][h.id]).length; tot += habits.length; }
    return tot ? done/tot : 0;
  });
  const avg = monthRates.reduce((a,b)=>a+b,0)/12;
  const best = monthRates.indexOf(Math.max(...monthRates));
  const worst = monthRates.indexOf(Math.min(...monthRates));
  const totalCompleted = Object.values(state.completions).reduce((acc,day)=>acc+Object.values(day).filter(Boolean).length,0);
  const longestStreak = habits.reduce((max,h)=>Math.max(max, habitBestStreak(h.id)), 0);
  const rows = MONTHS.map((name,i) => `
    <div class="year-row">
      <span class="m-label">${name}</span>
      <div class="m-track"><div class="m-fill" style="width:${Math.round(monthRates[i]*100)}%; background:${i===worst && monthRates[i]>0 ? 'var(--red)' : 'var(--primary)'};"></div></div>
      <span class="m-pct">${Math.round(monthRates[i]*100)}%</span>
    </div>`).join("");
  return `
    <div class="grid grid-4">
      <div class="card"><div class="stat-label">Completado anual</div><div class="stat-value">${Math.round(avg*100)}%</div></div>
      <div class="card"><div class="stat-label">Hábitos completados</div><div class="stat-value">${totalCompleted}</div></div>
      <div class="card"><div class="stat-label">Mejor mes</div><div class="stat-value">${avg>0?MONTHS[best]:"—"}</div></div>
      <div class="card"><div class="stat-label">Racha más larga</div><div class="stat-value">${longestStreak} días</div></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="section-title">Actividad por mes</div>
      ${rows}
    </div>`;
}

function viewGoals() {

    { period:"week", label:"Metas semanales", key: weekKey(state.currentDate) },
    { period:"month", label:"Metas mensuales", key: monthKey(state.currentDate) },
    { period:"year", label:"Metas anuales", key: yearKey(state.currentDate) },
  ];
  return sections.map((s) => {
    const list = state.goals[s.period][s.key] || [];
    return `
      <div class="section-block">
        <div class="section-title">${s.label} <span class="section-sub">· ${s.key}</span></div>
        ${list.length===0 ? `<div class="card"><div class="empty">Aún no hay metas para este periodo.</div></div>` :
          `<div class="grid grid-3">${list.map((g)=>goalCardHTML(g, s.period, s.key, false)).join("")}</div>`}
      </div>`;
  }).join("");
}
function goalCardHTML(g, period, key, compact) {
  const pct = g.target ? Math.min(100, Math.round((g.current/g.target)*100)) : 0;
  const done = pct >= 100;
  const unit = (UNIT_OPTIONS.find(u=>u.v===g.unit)||{}).l || "";
  return `
    <div class="goal-card">
      <div class="goal-top">
        <div><div class="goal-name">${esc(g.name)}</div><div class="goal-progress-text">${g.current} / ${g.target} ${unit}</div></div>
        ${!compact ? `<div style="display:flex;gap:2px;">
          <button class="small-icon-btn" onclick='openGoalModal(${JSON.stringify(Object.assign({},g,{period}))})'>✏️</button>
          <button class="small-icon-btn" onclick="deleteGoal('${period}','${key}','${g.id}')">🗑️</button>
        </div>` : ""}
      </div>
      <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${pct}%; background:${done?'var(--green)':'var(--primary)'};"></div></div>
      ${!compact ? `
      <div class="goal-foot">
        <span style="font-size:11px;font-weight:600;color:${done?'var(--green)':'var(--sub)'};">${done?'¡Completada! 🎉':pct+'%'}</span>
        <div class="stepper">
          <button onclick="bumpGoal('${period}','${key}','${g.id}',-1)">–</button>
          <button onclick="bumpGoal('${period}','${key}','${g.id}',1)">+</button>
        </div>
      </div>` : ""}
    </div>`;
}

function viewStats() {
  if (state.habits.length === 0) return `<div class="card"><div class="empty">Añade hábitos para ver estadísticas detalladas.</div></div>`;
  const totalDays = Object.keys(state.completions).length || 1;
  const data = state.habits.map((h) => ({
    name: h.name, color: h.color,
    value: Math.round((Object.keys(state.completions).filter((k)=>state.completions[k] && state.completions[k][h.id]).length / totalDays) * 100),
  }));
  const habitCards = state.habits.map((h) => `
    <div class="habit-card">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;">${h.icon} ${esc(h.name)}</div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);">
        <span>Racha: <b style="color:var(--ink)">${habitStreak(h.id)}</b></span>
        <span>Mejor: <b style="color:var(--ink)">${habitBestStreak(h.id)}</b></span>
      </div>
    </div>`).join("");
  return `
    <div class="card"><div class="section-title">Cumplimiento por hábito</div>${hbarChartHTML(data)}</div>
    <div class="grid grid-4" style="margin-top:16px;">${habitCards}</div>`;
}

function viewSettings() {
  const theme = getTheme();
  const accountSection = state.account ? `
    <div class="account-box">
      <div><div class="who">☁️ ${esc(state.account)}</div><div class="sub">Cuenta en la nube · datos sincronizados con Supabase</div></div>
      <button class="btn btn-ghost" onclick="logoutAccount()">Cerrar sesión</button>
    </div>
  ` : `
    <div class="account-box">
      <div><div class="who">👤 Invitado</div><div class="sub">Modo local en este navegador</div></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button class="btn btn-primary" onclick="openCreateAccountModal()">+ Crear cuenta</button>
      <button class="btn btn-soft" onclick="openLoginModal()">Iniciar sesión</button>
    </div>
  `;
  const cloudStatus = CLOUD_READY
    ? `<span style="color:var(--green);font-weight:700;">● Supabase conectado</span>`
    : `<span style="color:var(--orange);font-weight:700;">● Supabase sin configurar</span>`;
  return `
    <div class="card settings-card">
      <div class="section-title">Apariencia</div>
      <div class="theme-toggle">
        <button class="theme-btn ${theme==='light'?'active':''}" onclick="setTheme('light')"><span class="swatch">☀️</span>Claro</button>
        <button class="theme-btn ${theme==='dark'?'active':''}" onclick="setTheme('dark')"><span class="swatch">🌙</span>Oscuro</button>
      </div>
    </div>
    <div class="card settings-card" style="margin-top:16px;">
      <div class="section-title">Cuenta en la nube</div>
      <p style="margin-top:-6px;">${cloudStatus}</p>
      <p>Las cuentas usan Supabase Auth y tus hábitos, metas, wellness y registros se guardan en una base de datos asociada a tu cuenta.</p>
      ${accountSection}
      ${!CLOUD_READY ? `<div style="margin-top:14px;padding:12px;background:var(--primary-soft);border:1px solid var(--border);font-size:12px;line-height:1.55;"><b>Falta conectar Supabase:</b> abre el archivo y pega tu Project URL y tu anon/public key donde dice <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code>.</div>` : ``}
    </div>
    <div class="card settings-card" style="margin-top:16px;">
      <div class="section-title">Almacenamiento</div>
      <p>La app mantiene una copia local de respaldo y, cuando hay sesión iniciada, sincroniza los datos con la nube.</p>
      <button class="btn btn-danger" onclick="resetAll()">🗑️ Reiniciar datos de este perfil</button>
    </div>`;
}
function openAccountAccessModal() {
  openModal(`<div class="modal-head"><h3>Tu cuenta</h3><button class="small-icon-btn" onclick="closeModal()">✕</button></div>
  <p>${CLOUD_READY ? "Crea una cuenta para sincronizar tus datos entre dispositivos." : "Supabase todavía no está configurado en este archivo."}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
  <button class="btn btn-primary" onclick="openCreateAccountModal()">+ Crear cuenta</button>
  <button class="btn btn-soft" onclick="openLoginModal()">Iniciar sesión</button></div>
  ${state.account ? `<div class="account-box"><div><div class="who">☁️ ${esc(state.account)}</div><div class="sub">Cuenta activa</div></div><button class="btn btn-ghost" onclick="logoutAccount();closeModal();">Cerrar sesión</button></div>` : ``}`);
}
function openCreateAccountModal() {
  openModal(`<div class="modal-head"><h3>Crear cuenta</h3><button class="small-icon-btn" onclick="closeModal()">✕</button></div>
  <div class="field"><span class="field-label">Correo electrónico</span><input id="acc-user" type="email" placeholder="tu@email.com"></div>
  <div class="field"><span class="field-label">Contraseña</span><input id="acc-pass" type="password" placeholder="Mínimo 6 caracteres"></div>
  <p style="font-size:11.5px;color:var(--sub);">La contraseña la gestiona Supabase Auth; HabitFlow no la guarda en localStorage.</p>
  <div class="modal-foot end"><button class="btn btn-primary" onclick="createAccount(document.getElementById('acc-user').value, document.getElementById('acc-pass').value)">Crear cuenta</button></div>`);
}
function openLoginModal() {
  openModal(`<div class="modal-head"><h3>Iniciar sesión</h3><button class="small-icon-btn" onclick="closeModal()">✕</button></div>
  <div class="field"><span class="field-label">Correo electrónico</span><input id="acc-login-email" type="email"></div>
  <div class="field"><span class="field-label">Contraseña</span><input id="acc-login-pass" type="password"></div>
  <div class="modal-foot end"><button class="btn btn-primary" onclick="loginAccount(document.getElementById('acc-login-email').value, document.getElementById('acc-login-pass').value)">Entrar</button></div>`);
}

</script>
</body>
</html>
